<svg xmlns="http://www.w3.org/2000/svg" width="880" height="500" viewBox="0 0 880 500" role="img" aria-label="rex-launchpad panel open over a Rex terminal">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16171a"/>
      <stop offset="1" stop-color="#111214"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <style>
      text { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace; font-size: 14px; }
      .ui   { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; }
      .fg   { fill: #e6e6e6; }
      .dim  { fill: #7d7f86; }
      .term { fill: #4a4c52; }
      .acc  { fill: #5fafff; }
      .grn  { fill: #3fb950; }
      .cur  { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>

  <!-- window -->
  <rect x="0.5" y="0.5" width="879" height="499" rx="12" fill="url(#bg)" stroke="#2a2b30"/>
  <circle cx="22" cy="20" r="6" fill="#ff5f57"/>
  <circle cx="42" cy="20" r="6" fill="#febc2e"/>
  <circle cx="62" cy="20" r="6" fill="#28c840"/>
  <rect x="88" y="9" width="120" height="22" rx="6" fill="#222327"/>
  <text x="102" y="24" class="ui dim">web-app</text>
  <line x1="0" y1="40" x2="880" y2="40" stroke="#222327"/>

  <!-- terminal behind -->
  <text x="24" y="70" class="term">~/Projects/web-app on feat/auth</text>
  <text x="24" y="92" class="term">$ npm run dev</text>
  <text x="24" y="114" class="term">  ready in 412 ms  ➜  http://localhost:5173/</text>
  <text x="24" y="158" class="term">$ git status --short</text>
  <text x="24" y="180" class="term">  M src/auth/session.ts</text>
  <text x="24" y="202" class="term">  M src/routes/login.tsx</text>
  <text x="24" y="246" class="term">$ claude --continue</text>
  <text x="24" y="460" class="term">❯</text>

  <!-- floating panel -->
  <g filter="url(#shadow)">
    <rect x="160" y="62" width="560" height="400" rx="10" fill="#1e1f23" stroke="#34363c"/>
  </g>
  <rect x="160" y="62" width="560" height="26" rx="10" fill="#26272c"/>
  <rect x="160" y="78" width="560" height="10" fill="#26272c"/>
  <text x="178" y="80" class="ui dim">Launchpad</text>
  <line x1="160" y1="88" x2="720" y2="88" stroke="#34363c"/>

  <text x="186" y="122" class="fg" font-weight="700">Projects</text>

  <text x="186" y="160" class="acc" font-weight="700">›</text>
  <text x="204" y="160" class="fg">we</text>
  <rect x="222" y="148" width="8" height="16" class="acc cur"/>
  <line x1="186" y1="176" x2="694" y2="176" stroke="#3a3c42"/>

  <text x="186" y="208" class="dim">Open</text>

  <rect x="178" y="218" width="524" height="26" rx="4" fill="#303136"/>
  <text x="186" y="236" class="grn">●</text>
  <text x="204" y="236" class="fg" font-weight="700">web-app</text>
  <text x="646" y="236" class="dim" text-anchor="end">feat/auth</text>
  <text x="694" y="236" class="dim" text-anchor="end">2m</text>

  <text x="186" y="262" class="grn">●</text>
  <text x="204" y="262" class="fg">website</text>
  <text x="694" y="262" class="dim" text-anchor="end">1h</text>

  <text x="186" y="302" class="dim">Recent</text>
  <text x="204" y="330" class="fg">web-components</text>
  <text x="694" y="330" class="dim" text-anchor="end">3d</text>
  <text x="204" y="356" class="fg">weather-api</text>
  <text x="694" y="356" class="dim" text-anchor="end">2w</text>
  <text x="204" y="382" class="fg">webhooks</text>
  <text x="646" y="382" class="dim" text-anchor="end">v2</text>
  <text x="694" y="382" class="dim" text-anchor="end">1mo</text>

  <text x="186" y="440" class="dim" font-weight="700">↵</text>
  <text x="200" y="440" class="dim">open</text>
  <text x="250" y="440" class="dim" font-weight="700">⌃N</text>
  <text x="274" y="440" class="dim">new</text>
  <text x="316" y="440" class="dim" font-weight="700">⌃F</text>
  <text x="340" y="440" class="dim">Finder</text>
  <text x="404" y="440" class="dim" font-weight="700">esc</text>
  <text x="436" y="440" class="dim">close</text>
</svg>
